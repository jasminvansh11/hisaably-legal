<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hisaably - Legal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            color: #222;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 45px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0;
            color: #16834b;
            font-size: 36px;
        }

        .tagline {
            color: #666;
            margin: 10px 0 35px;
            font-size: 16px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .links a {
            display: block;
            padding: 15px;
            border-radius: 10px;
            background: #16834b;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .links a:hover {
            opacity: 0.9;
        }

        .footer {
            margin-top: 35px;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 20px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Hisaably</h1>

        <p class="tagline">
            Har kharche ka simple hisaab.
        </p>

        <div class="links">

            <a href="privacy-policy.html">
                Privacy Policy
            </a>

            <a href="terms.html">
                Terms & Conditions
            </a>

        </div>

        <div class="footer">
            © 2026 Hisaably. All rights reserved.
        </div>

    </div>

</body>
</html>
